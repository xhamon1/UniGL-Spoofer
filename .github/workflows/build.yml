name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build native libraries
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "Using NDK: $NDK"
          mkdir -p module/zygisk
          for abi in arm64-v8a x86_64; do
            cmake -S . -B "build/$abi" -G Ninja \
              -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI="$abi" -DANDROID_PLATFORM=android-26 \
              -DANDROID_STL=c++_static -DCMAKE_BUILD_TYPE=Release
            cmake --build "build/$abi"
            "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" --strip-unneeded "build/$abi/libunigl.so"
            cp "build/$abi/libunigl.so" "module/zygisk/$abi.so"
          done

      - name: Package module zip
        id: pkg
        run: |
          VER=$(grep '^version=' module/module.prop | cut -d= -f2)
          NAME="UniGL-Spoofer-${VER}.zip"
          (cd module && zip -r9 "../$NAME" . -x '*.gitkeep')
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: ${{ steps.pkg.outputs.name }}

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: UniGL Spoofer ${{ github.ref_name }}
          generate_release_notes: true
          files: ${{ steps.pkg.outputs.name }}

      - name: Update update.json for root manager notifications (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VER=$(grep '^version=' module/module.prop | cut -d= -f2)
          CODE=$(grep '^versionCode=' module/module.prop | cut -d= -f2)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          printf '{\n  "version": "%s",\n  "versionCode": %s,\n  "zipUrl": "https://github.com/%s/releases/download/%s/UniGL-Spoofer-%s.zip",\n  "changelog": "https://raw.githubusercontent.com/%s/main/CHANGELOG.md"\n}\n' \
            "$VER" "$CODE" "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "$VER" "$GITHUB_REPOSITORY" > update.json
          git add update.json
          git diff --cached --quiet || git commit -m "Update update.json for $VER"
          git push origin main
